[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "news-data-kit"
version = "0.2.1+share.1"
description = "Public-source news collection for personal investment workbenches"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["feedparser>=6,<7", "tzdata>=2025"]

[project.optional-dependencies]
akshare = ["akshare>=1.18,<2"]
yfinance = ["yfinance>=0.2,<2"]
finviz = ["finvizfinance>=1,<2"]
fulltext = ["pyarrow>=14,<26"]
dev = ["pytest>=8,<10", "build>=1", "hatchling>=1.26"]

[tool.hatch.build.targets.wheel]
packages = ["src/news_data_kit"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "LICENSE", "NOTICE.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
